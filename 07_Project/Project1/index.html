<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <button>Home</button>
        <button>Youtube channel</button>
    </nav>

    <div class="container">
        <h1>Color Scheme Switcher</h1>

        <div class="colors">
            <span id="gray" class="box gray"></span>
            <span id="white" class="box white"></span>
            <span id="blue" class="box blue"></span>
            <span id="yellow" class="box yellow"></span>
        </div>
        <h2>
            Try clicking on one of the colors above <br>
            to change the background color of this page!
        </h2>
    </div>

</body>
<script src="script.js"></script>
</html>
